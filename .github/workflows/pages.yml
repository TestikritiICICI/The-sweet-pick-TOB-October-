name: Publish the edition

# Pages serves whatever this workflow uploads, so the site never depends on
# which branch the repository happens to default to.
#
# ONE-TIME STEP, needs a repository admin: Settings -> Pages -> Source ->
# "GitHub Actions". The configure-pages step below asks for the site to be
# created automatically, but GITHUB_TOKEN is refused that call here
# ("Resource not accessible by integration"), because creating a Pages site
# is an admin operation. Once the source is set, every push to this branch
# deploys on its own and this workflow needs no further attention.
on:
  push:
    branches: [claude/repo-file-exploration-yw0p4b]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # served at the bare site root, so the link is short enough to share
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp the-sweet-pick.html _site/index.html

      # enablement turns Pages on for the repository, so nobody has to go
      # through Settings by hand
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
