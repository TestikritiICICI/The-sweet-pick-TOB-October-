/* Saving a file differs by host. Inside the claude.ai artifact viewer a plain
   <a download> does nothing, so go through the downloads capability there and
   fall back to the anchor everywhere else (file://, self-hosted, PWA). */
let _dlProbe=null;
function dlCap(){
  return _dlProbe ||= (async()=>{
    try{ return window.claude?.use ? await window.claude.use('downloads') : null; }
    catch(e){ return null; }
  })();
}
async function dl(blob,name){
  const cap = await dlCap();
  if(cap){
    for(let attempt=0;attempt<2;attempt++){
      try{ await cap.save({filename:name, data:blob}); return true; }
      catch(err){
        const code = err?.code;
        if(code==='declined'){ toast('Download cancelled'); return false; }
        if(code==='rate_limited' && attempt===0){ await new Promise(r=>setTimeout(r,1000)); continue; }
        toast('Could not save '+name+(code?' — '+code:''),'err',4000);
        return false;
      }
    }
    return false;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  return true;
}
/* ---- video export: record the canvas in real time, no encoder dependency ---- */
const VMIME=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4',
             'video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
const pickVMime=()=>VMIME.find(m=>{ try{ return MediaRecorder.isTypeSupported(m); }catch(e){ return false; } })||'';
let AC=null; const audioNodes=new Map();

function recordSlide(cx,si,scale,stillDur,onProg){
  return new Promise(async resolve=>{
    const vids=vidLayers(si);
    const dur=slideDur(si)||stillDur;
    for(const L of vids){
      const r=VID.get(L.vid); if(!r) continue;
      const [t0]=trimOf(L);
      r.el.muted=L.muted!==false; r.el.volume=clamp(L.vol??1,0,1);
      r.el.playbackRate=clamp(L.rate||1,.25,4);
      await seekTo(r.el,t0);
    }
    for(const L of vids){ const r=VID.get(L.vid); if(r) r.el.play().catch(()=>{}); }
    const start=performance.now();
    const step=()=>{
      const t=(performance.now()-start)/1000;
      cx.setTransform(1,0,0,1,0,0);
      drawSlide(cx,si,scale);
      onProg?.(Math.min(1,t/dur));
      if(t>=dur){ for(const L of vids){ const r=VID.get(L.vid); if(r) r.el.pause(); } return resolve(); }
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

async function exportVideo(){
  const mime=pickVMime();
  if(!mime) throw new Error('this browser cannot record video');
  const which=$('#expWhich .on').dataset.v;
  const scale=parseFloat($('#expVScale .on').dataset.v);
  const stillDur=parseFloat($('#expStill').value);
  const idx = which==='one' ? [cur] : P.slides.map((_,i)=>i);

  const c=document.createElement('canvas');
  c.width=Math.round(P.w*scale); c.height=Math.round(P.h*scale);
  const cx=c.getContext('2d');
  cx.imageSmoothingQuality='high';
  const stream=c.captureStream(30);

  /* mix in audio from any clip the user unmuted */
  const unmuted=idx.flatMap(i=>vidLayers(i)).filter(L=>L.muted===false);
  if(unmuted.length){
    try{
      AC ||= new (window.AudioContext||window.webkitAudioContext)();
      if(AC.state==='suspended') await AC.resume();
      const dest=AC.createMediaStreamDestination();
      for(const L of unmuted){
        const r=VID.get(L.vid); if(!r) continue;
        let node=audioNodes.get(r.el);
        if(!node){ node=AC.createMediaElementSource(r.el); audioNodes.set(r.el,node); node.connect(AC.destination); }
        const gain=AC.createGain(); gain.gain.value=clamp(L.vol??1,0,1);
        node.connect(gain); gain.connect(dest);
      }
      for(const t of dest.stream.getAudioTracks()) stream.addTrack(t);
    }catch(e){ console.warn('[export] audio skipped:',e.message); }
  }

  const rec=new MediaRecorder(stream,{mimeType:mime, videoBitsPerSecond: scale>1?12e6:7e6});
  const chunks=[];
  rec.ondataavailable=e=>{ if(e.data?.size) chunks.push(e.data); };
  const stopped=new Promise(r=>{ rec.onstop=()=>r(); });
  rec.start(250);
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));  /* let capture latch on */

  stopPlay();
  const bar=$('#expProgB'), ptxt=$('#expProgT');
  for(let n=0;n<idx.length;n++){
    ptxt.textContent=`Recording slide ${n+1} of ${idx.length}…`;
    await recordSlide(cx,idx[n],scale,stillDur,f=>{
      bar.style.width=Math.round(((n+f)/idx.length)*100)+'%';
    });
  }
  /* the encoder trails the last drawn frame, and the final dataavailable can
     arrive after onstop — settle before reading the chunks */
  await new Promise(r=>setTimeout(r,150));
  try{ rec.requestData(); }catch(e){}
  await new Promise(r=>setTimeout(r,60));
  rec.stop();
  await stopped;
  await new Promise(r=>setTimeout(r,100));
  syncVideos(playhead,true); redraw();
  if(!chunks.length) throw new Error('the recorder produced no data');
  return { blob:new Blob(chunks,{type:mime}), ext: mime.startsWith('video/mp4')?'mp4':'webm' };
}

async function doExport(){
  if($('#expMode .on').dataset.v==='vid') return doExportVideo();
  const fmt   = $('#expFmt .on').dataset.v;
  const scale = +$('#expScale .on').dataset.v;
  const which = $('#expWhich .on').dataset.v;
  const zip   = $('#expZip').checked;
  const q     = (+$('#expQ').value)/100;
  const idx   = which==='one' ? [cur] : P.slides.map((_,i)=>i);
  const mime  = 'image/'+fmt;
  const ext   = fmt==='jpeg'?'jpg':fmt;
  const safe  = (P.name||'carousel').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase()||'carousel';

  const prog=$('#expProg'), bar=$('#expProgB'), ptxt=$('#expProgT');
  prog.style.display='flex'; $('#expGo').disabled=true;

  try{
    await document.fonts.ready;
    const files=[];
    for(let n=0;n<idx.length;n++){
      ptxt.textContent=`Rendering slide ${n+1} of ${idx.length}…`;
      bar.style.width=Math.round((n/idx.length)*100)+'%';
      const c=await renderExport(idx[n],scale);
      const blob=await c.convertToBlob(fmt==='png'?{type:mime}:{type:mime,quality:q});
      files.push({name:`${safe}-${String(n+1).padStart(2,'0')}.${ext}`,blob});
      await new Promise(r=>setTimeout(r,0));
    }
    bar.style.width='100%';
    if(zip && files.length>1){
      ptxt.textContent='Zipping…';
      await dl(await makeZip(files), safe+'.zip');
    }else{
      for(const f of files){
        const okSave = await dl(f.blob,f.name);
        if(okSave===false) break;                 /* viewer declined — stop asking */
        await new Promise(r=>setTimeout(r,220));
      }
    }
    toast(`Exported ${files.length} slide${files.length>1?'s':''}`,'ok');
    $('#expModal').classList.add('hide');
  }catch(e){
    console.error(e); toast('Export failed — '+e.message,'err',4000);
  }finally{
    prog.style.display='none'; bar.style.width='0'; $('#expGo').disabled=false;
  }
}

async function doExportVideo(){
  const safe=(P.name||'carousel').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase()||'carousel';
  const prog=$('#expProg'), bar=$('#expProgB');
  prog.style.display='flex'; $('#expGo').disabled=true;
  try{
    await document.fonts.ready;
    const {blob,ext}=await exportVideo();
    if(!blob.size) throw new Error('nothing was recorded');
    $('#expProgT').textContent='Saving…';
    await dl(blob, `${safe}.${ext}`);
    toast(`Exported ${(blob.size/1048576).toFixed(1)} MB ${ext.toUpperCase()}`,'ok');
    $('#expModal').classList.add('hide');
  }catch(e){
    console.error(e); toast('Video export failed — '+e.message,'err',4600);
  }finally{
    prog.style.display='none'; bar.style.width='0'; $('#expGo').disabled=false;
  }
}

async function openPreview(){
  const sc=$('#pvScroll'), dots=$('#pvDots');
  sc.innerHTML=''; dots.innerHTML='';
  const h=Math.min(window.innerHeight*0.72, 900);
  for(let i=0;i<P.slides.length;i++){
    const c=el('canvas');
    c.width=Math.round(P.w*.55); c.height=Math.round(P.h*.55);
    drawSlide(c.getContext('2d'),i,.55);
    sc.appendChild(c);
    dots.appendChild(el('i',i===0?'on':''));
  }
  $('#pvLabel').textContent=`${P.name||'Untitled'} — ${P.slides.length} slides`;
  $('#preview').classList.remove('hide');
  sc.onscroll=()=>{
    const i=Math.round(sc.scrollLeft/sc.clientWidth);
    [...dots.children].forEach((d,n)=>d.classList.toggle('on',n===i));
  };
}

/* ============================================================
   14. KEYBOARD
   ============================================================ */
addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  const mod=e.metaKey||e.ctrlKey;
  if(mod && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(mod && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
  if(typing) return;
  if(mod && e.key.toLowerCase()==='d'){ e.preventDefault();
    const L=selLayers()[0]; if(L){ const c=baseLayer({...L,id:uid(),x:L.x+24,y:L.y+24});
      slideOf(L.id).layers.push(c); sel=[c.id]; commit(); renderInspector(); } return; }
  if(mod && e.key.toLowerCase()==='a'){ e.preventDefault(); sel=P.slides[cur].layers.map(l=>l.id); drawChrome(); renderInspector(); return; }
  if(e.key===' '){ e.preventDefault(); togglePlay(); return; }
  if(e.key==='Escape'){ sel=[]; stopPlay(); drawChrome(); renderInspector(); $('#preview').classList.add('hide'); return; }
  if((e.key==='Delete'||e.key==='Backspace') && sel.length){ e.preventDefault(); removeLayers([...sel]); return; }
  if(e.key.startsWith('Arrow') && sel.length){
    e.preventDefault();
    const d=e.shiftKey?20:2;
    for(const L of selLayers()){
      if(e.key==='ArrowLeft')L.x-=d; if(e.key==='ArrowRight')L.x+=d;
      if(e.key==='ArrowUp')L.y-=d;   if(e.key==='ArrowDown')L.y+=d;
    }
    redraw(); drawChrome(); clearTimeout(window._nudge); window._nudge=setTimeout(push,400);
  }
  if(e.key==='['){ cur=clamp(cur-1,0,P.slides.length-1); sel=[]; redraw(); renderFilm(); renderInspector(); }
  if(e.key===']'){ cur=clamp(cur+1,0,P.slides.length-1); sel=[]; redraw(); renderFilm(); renderInspector(); }
});

/* new-project modal */
let npPreset='c45';
function buildPresetList(){
  const w=$('#presetList'); w.innerHTML='';
  for(const [k,v] of Object.entries(PRESETS)){
    const b=el('button','preset'+(k===npPreset?' on':''));
    const ar=v.w/v.h, hh=46, ww=Math.round(hh*ar);
    b.innerHTML=`<div class="sh" style="width:${ww}px;height:${hh}px"></div>
      <div class="t"><b>${v.label}</b><i>${v.w} × ${v.h}${v.safe?' · grid-safe marked':''}</i></div>`;
    b.onclick=()=>{ npPreset=k; buildPresetList(); };
    w.appendChild(b);
  }
}

async function boot(){
  await restoreImages(); await restoreVideos();
  let saved=null; try{ saved=await DB.get('docs','current'); }catch(e){}
  P = saved?.slides?.length ? saved : newProject('c45',3);
  if(!P.brand) P.brand={palette:['#FF5A36','#FFB03A','#0B0B0F','#FFFFFF'],font:'Inter'};
  $('#docname').value=P.name||'Untitled';
  try{ await Promise.all(FONTS.map(([f])=>document.fonts.load(`900 64px "${f}"`))); }catch(e){}
  fitBoard(); redraw(); renderFilm(); renderPanel(); renderInspector(); drawTransport();
  if(isMobile()){ $('#panel').classList.add('hide'); $('#insp').classList.add('hide'); }
  push(); updUndo();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  dlCap();                                   /* resolve the save path in the background */
  window.__ready=true;
}

window.__studio={ drawLayer, packSlide, STYLE_PACKS, FORMAT_PACKS, exportVideo, pickVMime, recordSlide, cutoutSelected, dl, dlCap, VID, addVideo, ingest, placeMedia, grabFrame,
  slideDur, vidLayers, trimOf, startPlay, stopPlay, scrubTo, srcOf, PRESETS, makeZip, crc32, textHeight, showSheet, PACKS, applyPack, get P(){return P}, get sel(){return sel}, get cur(){return cur},
  set cur(v){cur=v}, addText, addLayer, baseLayer, sliceAcross, addImage, drawSlide,
  renderExport, applyTemplate, TEMPLATES, redraw, renderFilm, renderInspector, renderPanel, IMG,
  select:ids=>{sel=ids;drawChrome();renderInspector()} };
boot();
